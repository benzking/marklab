<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>控制台 · 我的模型库</title>
<link rel="stylesheet" href="/console.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/console">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.6 20.4 7v10L12 21.4 3.6 17V7L12 2.6Z"/><path d="M3.6 7 12 11.4 20.4 7M12 11.4v10"/></svg>
    <strong>控制台</strong>
  </a>
  <div class="topnav">
    <a class="btn" href="/">模型库</a>
    <button class="btn" id="refresh" type="button">刷新</button>
    <button class="btn" id="side-toggle" type="button" aria-expanded="true" aria-controls="side" title="收起导航">☰</button>
  </div>
</header>

<div class="shell" id="shell">
  <aside class="side" id="side">
    <nav class="nav">
      <a class="nav-item" href="#dash" data-page="dash">数据大屏</a>
      <a class="nav-item" href="#tasks" data-page="tasks">抓取任务</a>
      <a class="nav-item" href="#subs" data-page="subs">订阅任务</a>
      <a class="nav-item" href="#logs" data-page="logs">运行日志</a>
      <a class="nav-item" href="#sites" data-page="sites">站点包</a>
      <a class="nav-item" href="#settings" data-page="settings">设置</a>
    </nav>
    <div class="side-foot muted small" id="side-foot"></div>
  </aside>

  <main class="pane">
    <!-- 数据大屏 -->
    <section class="page" id="page-dash" hidden>
      <div class="page-head">
        <h1>数据大屏</h1>
        <span class="muted small" id="wb-at"></span>
      </div>
      <div class="err" id="wb-err" hidden></div>
      <div class="stats" id="wb"><p class="muted small">加载中…</p></div>
    </section>

    <!-- 抓取任务 -->
    <section class="page" id="page-tasks" hidden>
      <div class="page-head">
        <h1>抓取任务</h1>
        <div class="right">
          <span class="tag" id="queue-state">运行中</span>
          <button class="btn sm" id="queue-toggle" type="button">暂停抓取</button>
          <span class="muted small" id="task-note">5 秒自动刷新</span>
        </div>
      </div>
      <div class="err" id="task-err" hidden></div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>时间</th><th>站点</th><th>标题</th><th>进度</th><th>来源</th><th>状态</th><th>耗时</th></tr></thead>
          <tbody id="task-rows"><tr><td colspan="7" class="muted small">加载中…</td></tr></tbody>
        </table>
      </div>
      <p class="muted small">点一行展开详情（日志、错误、原始链接、操作）。</p>
    </section>

    <!-- 订阅任务 -->
    <section class="page" id="page-subs" hidden>
      <div class="page-head">
        <h1>订阅任务</h1>
        <div class="right">
          <span class="note" id="sub-note"></span>
          <button class="btn sm" id="sub-stop-all" type="button">全部停止</button>
          <button class="btn sm primary" id="sub-new" type="button">新建订阅</button>
        </div>
      </div>
      <div class="err" id="subs-err" hidden></div>
      <div class="split">
        <div class="col-list">
          <div id="sub-list"><p class="muted small">加载中…</p></div>
        </div>
        <div class="col-detail" id="sub-detail">
          <p class="muted small">左边点一条订阅看详情，或点右上角新建。</p>
        </div>
      </div>

      <form class="form" id="sub-form" hidden>
        <input type="hidden" id="f-id" name="id">
        <div class="field">
          <label for="f-name">名称</label>
          <input id="f-name" name="name" type="text" placeholder="如：可动关节">
        </div>
        <div class="field wide" data-kind="keyword">
          <label for="f-kw">关键字（逗号分隔）</label>
          <input id="f-kw" name="keywords" type="text" placeholder="如：头盔, 可动关节, 收纳盒">
        </div>
        <div class="field wide" data-kind="author" hidden>
          <label for="f-users">作者主页（每行一个链接）</label>
          <textarea id="f-users" name="users" rows="2" placeholder="https://makerworld.com.cn/zh/@youngzhen&#10;https://space.snapmaker.cn/zh/creator/11307"></textarea>
        </div>
        <div class="field">
          <label for="f-kind">类型</label>
          <select id="f-kind" name="kind">
            <option value="keyword">关键字订阅（搜索 + 匹配）</option>
            <option value="author">作者订阅（他发的全下）</option>
          </select>
        </div>
        <div class="field wide" data-kind="keyword">
          <label>候选规则（站点 + 排序 + 前 N 条，每条规则搜一遍）</label>
          <div id="rule-rows"></div>
          <button class="btn sm" type="button" id="rule-add">加一条规则</button>
        </div>
        <div class="field wide" data-kind="keyword">
          <label>匹配方式（任一命中就算）</label>
          <div class="checks">
            <label><input type="checkbox" name="match" value="name" checked>按名字（标题含关键字）</label>
            <label><input type="checkbox" name="match" value="tag">按标签（只有 MakerWorld 带标签）</label>
          </div>
        </div>
        <div class="field" data-kind="keyword">
          <label for="f-likes">点赞数 ≥</label>
          <input id="f-likes" name="minLikes" type="number" min="0" step="1" value="0">
        </div>
        <div class="field" data-kind="keyword">
          <label for="f-dl">下载量 ≥</label>
          <input id="f-dl" name="minDownloads" type="number" min="0" step="1" value="0">
        </div>
        <div class="field" data-kind="keyword">
          <label>门槛条件</label>
          <div class="checks">
            <label><input type="checkbox" name="pickedOnly">只要精选</label>
          </div>
        </div>
        <div class="field">
          <label for="f-int">每几小时跑一次</label>
          <input id="f-int" name="intervalHours" type="number" min="0.5" step="0.5" value="8">
        </div>
        <div class="field">
          <label>启用</label>
          <label class="switch"><input type="checkbox" name="enabled" checked><span>到点自动跑</span></label>
        </div>
        <div class="form-foot">
          <button class="btn primary" type="submit" id="sub-submit">新建订阅</button>
          <button class="btn" type="button" id="sub-cancel">取消</button>
        </div>
      </form>
    </section>

    <!-- 运行日志 -->
    <section class="page" id="page-logs" hidden>
      <div class="page-head">
        <h1>运行日志</h1>
        <div class="right"><span class="muted small" id="log-note"></span></div>
      </div>
      <div class="chips" id="log-chips">
        <button class="chip on" type="button" data-type="all">全部</button>
        <button class="chip" type="button" data-type="queue">抓取队列</button>
        <button class="chip" type="button" data-type="subscribe">订阅命中</button>
        <button class="chip" type="button" data-type="tag">智能标签</button>
        <button class="chip" type="button" data-type="dup">判重</button>
      </div>
      <div class="err" id="log-err" hidden></div>
      <div class="timeline" id="log-list"><p class="muted small">加载中…</p></div>
    </section>

    <!-- 站点包 -->
    <section class="page" id="page-sites" hidden>
      <div class="page-head">
        <h1>站点包</h1>
        <div class="right">
          <span class="muted small" id="login-note"></span>
          <button class="btn sm" id="login-recheck" type="button">登录状态刷新</button>
        </div>
      </div>
      <div class="err" id="login-err" hidden></div>
      <div class="sites" id="site-cards"><p class="muted small">加载中…</p></div>
      <h3 class="sub-h">登录态</h3>
      <div class="login-list" id="login-list"><p class="muted small">检测中…</p></div>
    </section>

    <!-- 设置 -->
    <section class="page" id="page-settings" hidden>
      <div class="page-head">
        <h1>设置</h1>
        <div class="right"><span class="muted small" id="llm-tags">标签池 — 个</span></div>
      </div>
      <div class="err" id="llm-err" hidden></div>
      <h3 class="sub-h">大模型打标签</h3>
      <div class="form">
        <div class="field wide">
          <label for="llm-base">baseUrl</label>
          <input id="llm-base" type="text" placeholder="https://api.deepseek.com/v1" spellcheck="false">
        </div>
        <div class="field">
          <label for="llm-key">apiKey</label>
          <input id="llm-key" type="password" autocomplete="off" placeholder="已保存，留空不改">
        </div>
        <div class="field">
          <label for="llm-model">model</label>
          <input id="llm-model" type="text" list="llm-model-list" placeholder="deepseek-chat" spellcheck="false">
          <datalist id="llm-model-list"></datalist>
        </div>
        <div class="form-foot">
          <button class="btn primary" id="llm-save" type="button">保存</button>
          <button class="btn" id="llm-models" type="button">获取模型列表</button>
          <span class="note" id="llm-note"></span>
        </div>
      </div>
      <h3 class="sub-h">批量动作</h3>
      <div class="form">
        <div class="form-foot" style="flex-wrap:wrap;gap:8px">
          <button class="btn" id="llm-tag-all" type="button">给还没标签的模型打标签</button>
          <button class="btn" id="refetch-all" type="button">补抓「站点有文件、本地没有」的模型</button>
          <span class="note" id="batch-note"></span>
        </div>
      </div>
      <div class="sub">打标签每个模型调一次大模型，是真花钱；补抓只是排进队列，照旧走 60–120 秒闸门。</div>
      <h3 class="sub-h">待确认的新词</h3>
      <div id="llm-pending"></div>
    </section>
  </main>
</div>

<script src="/console.js"></script>
</body>
</html>
